name: datalake

# Variables MinIO partagées par Airflow et le dashboard
x-minio-env: &minio-env
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

x-airflow-common: &airflow-common
  image: datalake/airflow:2.10.5        # image construite par le Dockerfile
  environment:
    <<: *minio-env                      # MINIO_ENDPOINT=http://minio:9000 + identifiants
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-datalake-dev-secret-key}
    PYTHONPATH: /opt/airflow/src
    SODA_APP_TOKEN: ${SODA_APP_TOKEN:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   
      - "9001:9001"   # console web
    volumes:
      - minio-data:/data

  # ---- Airflow
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    build: .
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin
        --firstname Admin --lastname User --role Admin --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # ---------- Exposition ----------
  dashboard:
    build: ./src/serving
    image: datalake/dashboard:1.0
    environment:
      <<: *minio-env
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src:ro
    ports:
      - "8501:8501"
    command: streamlit run /app/src/serving/dashboard.py --server.address=0.0.0.0 --server.port=8501 --browser.gatherUsageStats=false
    depends_on:
      - minio
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  airflow-logs: